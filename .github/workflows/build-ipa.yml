name: Build unsigned IPA

# Builds the app on GitHub's free macOS runners (no Mac required on your side)
# and uploads an unsigned .ipa you can download and sign yourself with
# Sideloadly / AltStore straight from Windows.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned .app for iphoneos
        run: |
          
          xcodebuild \
            -project CalculatorTrick.xcodeproj \
            -target CalculatorTrick \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR=build \
            clean build

      - name: Package into .ipa (Payload/ layout)
        run: |
          
          mkdir -p Payload
          cp -R "build/CalculatorTrick.app" Payload/
          zip -r CalculatorTrick-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorTrick-unsigned-ipa
          path: CalculatorTrick-unsigned-ipa
